global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'politburo-dev'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

scrape_configs:
  # Politburo API metrics — process runs on the host (outside Docker), reached via host.docker.internal
  - job_name: 'politburo'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 5s

services:
  # politburo now runs directly via tmux (see start-dev.sh)
  # politburo:
  #   build:
  #     context: ../politburo
  #     dockerfile: Dockerfile.dev
  #     target: dev
  #   working_dir: /app      # <--- root, not /app/cmd/server
  #   container_name: politburo
  #   volumes:
  #     - ../politburo:/app
  #     - politburo_air_tmp:/app/.air_tmp
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - ../politburo/.env
  #   command: ["sh","-c","sleep 10 && air -c air.toml"]
  #   #command: ["air", "-c", "air.toml", "-d"]
  #   stdin_open: true
  #   labels:
  #     service: "politburo"
  #     env: "dev"
  #   depends_on:
  #     - db
  #     - redis

  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: infinite
      POSTGRES_USER: ieuser
      POSTGRES_PASSWORD: iepass
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
      - ../politburo/internal/db/migrations:/migrations:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
  
  pgadmin:
    image: dpage/pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: sanketpandia@gmail.com
      PGADMIN_DEFAULT_PASSWORD: ieadmin
    ports:
      - "5050:80"
    depends_on:
      - db

  swagger-editor:
    image: swaggerapi/swagger-editor
    restart: always
    ports:
      - "8081:80"

  comrade-bot:
    build:
      context: ../comrade-bot
      dockerfile: Dockerfile.dev
    container_name: comrade-bot
    working_dir: /app
    network_mode: "host"
    volumes:
      - ../comrade-bot:/app
      # Keep node_modules inside the container so native deps (e.g. canvas → libjpeg) match container libs
      - comrade_bot_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && exec ts-node-dev --respawn --transpile-only src/index.ts"]
    stdin_open: true
    env_file:
      - ../comrade-bot/.env
    environment:
      APP_ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-info}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_HOST: ${METRICS_HOST:-0.0.0.0}
      METRICS_PORT: ${METRICS_PORT:-9091}
    labels:
      service: "comrade-bot"
      env: "dev"


  vizburo:
    build:
      context: ../politburo
      dockerfile: Dockerfile.vizburo.dev
    container_name: vizburo
    working_dir: /app
    volumes:
      - ../politburo:/app
    stdin_open: true

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.dev.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-storage:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=7d'

  loki:
    image: grafana/loki:latest
    container_name: loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./loki.dev.yml:/etc/loki/local-config.yml:ro
      - loki-storage:/loki
    command: -config.file=/etc/loki/local-config.yml

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: always
    # userns_mode: keep-id runs the container as the host user (eklavya) so the
    # systemd-journal group membership carries through and grants read access to
    # /var/log/journal. Requires: sudo usermod -aG systemd-journal eklavya + re-login.
    userns_mode: "keep-id"
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log/journal:/var/log/journal:ro
      - /var/log:/var/log:ro
      # Mount host /tmp so Promtail can tail /tmp/politburo.log written by the host air process
      - /tmp:/host-tmp:ro
    ports:
      - "9080:9080"
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - default

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_SECURITY_ADMIN_USER: admin
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    depends_on:
      - prometheus
      - loki

volumes:
  pgdata-dev:
  politburo_air_tmp:
  redis-data:
  prometheus-storage:
  loki-storage:
  grafana-storage:
  comrade_bot_node_modules:
